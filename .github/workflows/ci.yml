name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  size-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check bundle size
        run: |
          CORE_SIZE=$(gzip -c dist/index.js | wc -c)
          echo "Core bundle: ${CORE_SIZE} bytes gzipped"
          if [ "$CORE_SIZE" -gt 10240 ]; then
            echo "::error::Core bundle exceeds 10KB gzipped ($CORE_SIZE bytes)"
            exit 1
          fi
